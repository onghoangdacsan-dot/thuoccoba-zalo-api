<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Đơn hàng – Thuộc Cô Ba</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #fdf8f0;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    h1 { color: #8b4513; font-size: 1.25rem; }
    .card {
      background: #fff;
      border: 1px solid #deb887;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    input, button, select {
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #8b4513;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: #666; }
    button.ok { background: #16a34a; }
    button.print-btn { background: #2563eb; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid #f0e6d8;
      padding: 10px 6px;
      text-align: left;
      vertical-align: top;
    }
    th { color: #8b4513; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .pending { background: #fef3c7; color: #92400e; }
    .preparing { background: #dbeafe; color: #1e40af; }
    .shipping { background: #e0e7ff; color: #3730a3; }
    .completed { background: #dcfce7; color: #166534; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .actions button { font-size: 11px; padding: 4px 8px; }
    #loginBox { max-width: 360px; margin: 40px auto; }
    #app { display: none; }
    .muted { color: #888; font-size: 12px; }
    .err { color: #b91c1c; font-size: 13px; margin-top: 8px; }
    .products {
      margin-top: 6px;
      padding: 6px 8px;
      background: #fdf6e9;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
    }
    .products strong { color: #8b4513; }

    /* ===== PHIẾU IN ===== */
    #printModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #printModal.show { display: flex; }
    .print-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    #print-area {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 18px 20px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      color: #000;
      line-height: 1.4;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    /* ===== CẤU HÌNH GIẤY IN 100x150mm (chuẩn J&T / Shopee) ===== */
    @media print {
      @page {
        size: 100mm 150mm;
        margin: 4mm;
      }

      body * {
        visibility: hidden;
      }

      #print-area, #print-area * {
        visibility: visible;
      }

      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 100%;
        box-shadow: none;
        border-radius: 0;
        padding: 3mm;
        font-size: 12px;
      }

      .print-actions {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="loginBox" class="card">
    <h1>🔐 Admin – Thuộc Cô Ba</h1>
    <p class="muted">Nhập mật khẩu để quản lý đơn hàng</p>
    <input id="pwd" type="password" placeholder="Mật khẩu" style="width:100%;margin:8px 0" />
    <button onclick="login()" style="width:100%">Đăng nhập</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="app">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h1>📦 Đơn hàng Mini App</h1>
      <div>
        <button class="secondary" onclick="loadOrders()">↻ Tải lại</button>
        <button class="secondary" onclick="logout()">Thoát</button>
      </div>
    </div>
    <div class="card">
      <div id="stats" class="muted" style="margin-bottom:12px"></div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Thời gian</th>
              <th>Khách + Sản phẩm</th>
              <th>Tổng</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal In phiếu -->
  <div id="printModal">
    <div class="print-actions">
      <button class="ok" onclick="window.print()">🖨️ In phiếu</button>
      <button class="secondary" onclick="closePrint()">Đóng</button>
    </div>
    <div id="print-area"></div>
  </div>

  <script>
    const STATUS_LABEL = {
      pending: "Chờ xác nhận",
      preparing: "Đang chuẩn bị",
      shipping: "Đang giao",
      completed: "Đã giao",
    };

    let currentOrders = [];

    function getPwd() {
      return sessionStorage.getItem("admin_pwd") || "";
    }

    function login() {
      const pwd = document.getElementById("pwd").value.trim();
      if (!pwd) {
        document.getElementById("loginErr").textContent = "Nhập mật khẩu";
        return;
      }
      sessionStorage.setItem("admin_pwd", pwd);
      document.getElementById("loginErr").textContent = "";
      showApp();
      loadOrders();
    }

    function logout() {
      sessionStorage.removeItem("admin_pwd");
      document.getElementById("app").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
    }

    function showApp() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("app").style.display = "block";
    }

    async function loadOrders() {
      try {
        const res = await fetch("/api/orders");
        const list = await res.json();
        currentOrders = list;
        render(list);
      } catch (e) {
        alert("Không tải được đơn: " + e.message);
      }
    }

    function render(list) {
      const counts = { pending: 0, preparing: 0, shipping: 0, completed: 0 };
      list.forEach((o) => {
        if (counts[o.status] !== undefined) counts[o.status]++;
      });
      document.getElementById("stats").textContent =
        `Tổng ${list.length} đơn · Chờ ${counts.pending} · Chuẩn bị ${counts.preparing} · Đang giao ${counts.shipping} · Đã giao ${counts.completed}`;

      const tbody = document.getElementById("tbody");
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">Chưa có đơn nào</td></tr>';
        return;
      }

      tbody.innerHTML = list
        .map((o, index) => {
          const ship = o.shippingInfo || {};
          const name = ship.fullName || "—";
          const phone = ship.phone || "";
          const addr = ship.address || "";
          const total = Number(o.total || 0).toLocaleString("vi-VN");
          const time = o.createdAt
            ? new Date(o.createdAt).toLocaleString("vi-VN")
            : "—";
          const st = o.status || "pending";

          let productsHtml = "";
          if (o.items && o.items.length > 0) {
            productsHtml = `
              <div class="products">
                <strong>Sản phẩm đã đặt:</strong><br/>
                ${o.items
                  .map(
                    (item) =>
                      `• ${item.quantity || 1} × ${item.name || "Sản phẩm"} 
                       (${Number(item.price || 0).toLocaleString("vi-VN")} đ)`
                  )
                  .join("<br/>")}
              </div>`;
          } else {
            productsHtml = `<div class="products muted">Không có thông tin sản phẩm</div>`;
          }

          return `
            <tr>
              <td><strong>${o.id}</strong></td>
              <td>${time}</td>
              <td>
                <strong>${name}</strong><br/>
                <span class="muted">${phone}</span><br/>
                <span class="muted">${addr}</span>
                ${productsHtml}
              </td>
              <td><strong>${total} đ</strong></td>
              <td><span class="badge ${st}">${STATUS_LABEL[st] || st}</span></td>
              <td class="actions">
                <button class="print-btn" onclick="printOrder(${index})">In phiếu</button>
                <button onclick="setStatus('${o.id}','preparing')">Chuẩn bị</button>
                <button onclick="setStatus('${o.id}','shipping')">Đang giao</button>
                <button class="ok" onclick="setStatus('${o.id}','completed')">Đã giao</button>
                <button class="secondary" onclick="setStatus('${o.id}','pending')">Về chờ</button>
              </td>
            </tr>`;
        })
        .join("");
    }

    function printOrder(index) {
      const o = currentOrders[index];
      if (!o) return;

      const ship = o.shippingInfo || {};
      const items = o.items || [];
      const total = Number(o.total || 0).toLocaleString("vi-VN");
      const orderId = o.id || "—";
      const createdAt = o.createdAt
        ? new Date(o.createdAt).toLocaleString("vi-VN")
        : "—";

      let itemsRows = "";
      if (items.length > 0) {
        itemsRows = items
          .map(
            (item) => `
            <tr>
              <td style="padding:5px 0;border-bottom:1px dashed #ccc">${item.name || "Sản phẩm"}</td>
              <td style="text-align:center;border-bottom:1px dashed #ccc">${item.quantity || 1}</td>
              <td style="text-align:right;border-bottom:1px dashed #ccc">
                ${Number((item.price || 0) * (item.quantity || 1)).toLocaleString("vi-VN")}đ
              </td>
            </tr>`
          )
          .join("");
      } else {
        itemsRows = `<tr><td colspan="3" style="padding:8px 0;color:#666">Không có thông tin sản phẩm</td></tr>`;
      }

      document.getElementById("print-area").innerHTML = `
        <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px">
          <div style="font-size:18px;font-weight:900;letter-spacing:0.5px">THUỘC CÔ BA</div>
          <div style="font-size:12px;margin-top:2px">Đặc sản mắm truyền thống OCOP 4 Sao</div>
          <div style="font-size:11px;margin-top:4px;color:#333">1117/5 Võ Nguyên Giáp, Hoài Nhơn, Gia Lai</div>
          <div style="font-size:11px">Hotline: 0909.xxx.xxx</div>
        </div>

        <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px">
          <div><strong>Mã đơn:</strong> ${orderId}</div>
          <div>${createdAt}</div>
        </div>

        <div style="text-align:center;font-family:monospace;font-size:20px;font-weight:700;letter-spacing:2px;border:1px solid #000;padding:8px 0;margin-bottom:14px;background:#f9f9f9">
          *${orderId}*
        </div>

        <div style="border:2px solid #000;padding:10px 12px;margin-bottom:14px;background:#fafafa">
          <div style="font-size:11px;font-weight:700;margin-bottom:4px">NGƯỜI NHẬN:</div>
          <div style="font-size:16px;font-weight:900">${ship.fullName || "—"}</div>
          <div style="font-size:15px;font-weight:700;margin:4px 0">${ship.phone || "—"}</div>
          <div style="font-size:13px;line-height:1.45">${ship.address || "—"}</div>
        </div>

        <div style="margin-bottom:12px">
          <div style="font-weight:700;margin-bottom:6px;border-bottom:1px solid #000;padding-bottom:4px">SẢN PHẨM</div>
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead>
              <tr>
                <th style="text-align:left;padding:4px 0">Tên sản phẩm</th>
                <th style="text-align:center;width:40px">SL</th>
                <th style="text-align:right;width:80px">Thành tiền</th>
              </tr>
            </thead>
            <tbody>
              ${itemsRows}
            </tbody>
          </table>
        </div>

        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:900;border-top:2px solid #000;padding-top:8px;margin-bottom:12px">
          <span>TỔNG THU (COD)</span>
          <span>${total} đ</span>
        </div>

        <div style="font-size:11px;color:#333;margin-bottom:10px">
          <strong>Ghi chú:</strong> Thanh toán khi nhận hàng (COD). Kiểm tra hàng trước khi thanh toán.
        </div>

        <div style="text-align:center;font-size:11px;border-top:1px dashed #000;padding-top:8px;color:#444">
          Cảm ơn quý khách đã tin tưởng Thuộc Cô Ba!<br/>
          Hotline hỗ trợ: 0909.xxx.xxx
        </div>
      `;

      document.getElementById("printModal").classList.add("show");
    }

    function closePrint() {
      document.getElementById("printModal").classList.remove("show");
    }

    async function setStatus(orderId, status) {
      const pwd = getPwd();
      if (!pwd) {
        logout();
        return;
      }
      try {
        const res = await fetch("/api/orders/" + encodeURIComponent(orderId) + "/status", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": pwd,
          },
          body: JSON.stringify({ status }),
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "Lỗi cập nhật");
          if (res.status === 401) logout();
          return;
        }
        loadOrders();
      } catch (e) {
        alert("Lỗi mạng: " + e.message);
      }
    }

    if (getPwd()) {
      showApp();
      loadOrders();
    }
  </script>
</body>
</html>
